apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: eu-west-1-region-partition
  namespace: checkout-mesh
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - checkout-mesh
    labelSelectors:
      region: eu-west-1-primary
  direction: both
  duration: "90s"
