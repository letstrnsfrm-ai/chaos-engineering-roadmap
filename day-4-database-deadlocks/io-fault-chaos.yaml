apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: ledger-db-disk-deadlock
  namespace: checkout-mesh
spec:
  action: fault
  mode: one
  selector:
    namespaces:
      - checkout-mesh
    labelSelectors:
      app: ledger-db
  volumePath: /var/lib/postgresql/data
  path: "/var/lib/postgresql/data/**/*"
  errno: 28 # ENOSPC / Disk I/O exhaustion
  percent: 100
  duration: "60s"
